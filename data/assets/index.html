    const res = await fetch(`/api/device/${encodeURIComponent(address)}/connect-status`);
    const data = await res.json();
    if (address !== currentDeviceAddress) return;
    // See pendingConnectAction above: ignore a poll response that's stale
    // relative to a click already in flight, rather than visibly reverting
    // to it for a moment.
    if (pendingConnectAction === 'connect' && data.state === 'disconnected') return;
    if (pendingConnectAction === 'disconnect' && data.state !== 'disconnected') return;
    pendingConnectAction = null;
    // Captured before renderConnectButton overwrites lastConnectState, so a
    // real transition can be told apart from just re-confirming the same
    // state on the next poll tick. previousState === null means this is the
    // modal's first-ever status check for this device (see openModal) --
    // skipped so reopening the modal on an already-connected device doesn't
    // toast "Connection successful" for a connection that isn't new.
    const previousState = lastConnectState;
    renderConnectButton(data.state);
    if (previousState !== null && previousState !== data.state) {
      if (data.state === 'connected') {
        showToast(`Connection successful: ${address}`);
      } else if (data.state === 'disconnected' && previousState === 'connected') {
        showToast(`Device disconnected: ${address}`, { variant: 'disconnected' });
      } else if (data.state === 'disconnected' && previousState === 'connecting') {
        // bluez_monitor.py never reports a connect as a hard failure (see
        // CONNECT_BUTTON_LABELS' own comment) -- it just gives up waiting
        // and quietly reverts to 'disconnected' (_connect_timeout there).
        // From here though, connecting->disconnected with no 'connected' in
        // between IS distinguishable from a real disconnect (previousState
        // above would be 'connected' for that), so it's worth its own toast
        // rather than looking identical to one.
        showToast(`Connection unsuccessful: ${address}`, { variant: 'unsuccessful' });
      }
    }
  } catch (err) {
    // Leave the button as-is; the next poll retries.
  }
}

// Address -> last-known connect state from the poll below, kept separate
// from currentDeviceAddress/lastConnectState above (those only track
// whichever single device's modal happens to be open right now). null until
// pollGlobalConnectStatuses' first tick has actually run, so that first
// tick can seed this without toasting for devices that were already
// connected/connecting before the page ever loaded.
let globalConnectStates = null;

// Polls EVERY device's connect state, unlike refreshConnectStatus above
// (one address, only while its modal is open) -- so a background auto-
// connect/disconnect (see auto_connect_latest_tick in bluez_monitor.py)
// still toasts even with no device modal open at all, or one open on a
// different device. Runs unconditionally from page load (see
// GLOBAL_CONNECT_POLL_MS below), not gated behind the auto-refresh toggle:
// that toggle only controls re-loading the graph/table and has nothing to
// do with connect events.
async function pollGlobalConnectStatuses() {
  try {
    const res = await fetch('/api/device-connections');
    const data = await res.json();
    const previous = globalConnectStates;
    globalConnectStates = data;
    if (previous === null) return; // seed-only tick, see globalConnectStates above
    for (const [address, { state }] of Object.entries(data)) {
      // currentDeviceAddress's own transitions are already toasted by
      // refreshConnectStatus's poll -- skipped here so a manual Connect/
      // Disconnect with that device's modal open doesn't toast twice.
      if (address === currentDeviceAddress) continue;
      const prevState = previous[address] ? previous[address].state : 'disconnected';
      if (prevState === state) continue;
      if (state === 'connected') {
        showToast(`Connection successful: ${address}`);
      } else if (state === 'disconnected' && prevState === 'connected') {
        showToast(`Device disconnected: ${address}`, { variant: 'disconnected' });
      } else if (state === 'disconnected' && prevState === 'connecting') {
        // Same "gave up waiting, never a hard failure" case refreshConnectStatus
        // documents above.
        showToast(`Connection unsuccessful: ${address}`, { variant: 'unsuccessful' });
      }
    }
  } catch (err) {
    // Leave globalConnectStates as its last-known value; the next poll retries.
  }
}

const GLOBAL_CONNECT_POLL_MS = 2000;

const TOAST_VISIBLE_MS = 3000;
const TOAST_FADE_MS = 200;

// Brief, non-blocking status popup (see #toast-container's own CSS comment)
// -- deliberately not window.alert(): a real device Connect/Disconnect
// isn't important enough to block the whole page on a modal dialog the user
// has to dismiss, especially since bluez_monitor.py can report it well
// after the click that triggered it (see refreshConnectStatus's polling).
function showToast(message, opts) {
  const toast = document.createElement('div');
  toast.className = 'toast' + (opts && opts.variant ? ` toast-${opts.variant}` : '');
  toast.textContent = message;
  document.getElementById('toast-container').appendChild(toast);
  // Rendered hidden first, then flipped to visible on the next frame so the
  // opacity/transform transition actually animates in, rather than starting
  // already at its end state.
  requestAnimationFrame(() => toast.classList.add('toast-visible'));
  setTimeout(() => {
    toast.classList.remove('toast-visible');
    setTimeout(() => toast.remove(), TOAST_FADE_MS);
  }, TOAST_VISIBLE_MS);
}

// No 'error' state: bluez_monitor.py never reports a connect as failed (see
// _connect_timeout there) -- a profile/security-level hiccup along the way
// (e.g. a device requiring bonding for one particular profile) isn't the
// same thing as the connection itself failing, so the only states that
// ever actually reach here are these three.
const CONNECT_BUTTON_LABELS = {
  disconnected: 'Connect', connecting: 'Connecting…', connected: 'Disconnect',
};

function renderConnectButton(state) {
  const btn = document.getElementById('connect-btn');
  if (!btn) return;
  lastConnectState = state;
  btn.textContent = CONNECT_BUTTON_LABELS[state] || 'Connect';
  btn.disabled = state === 'connecting';
  btn.dataset.state = state;
}

// Connect and Disconnect behave differently here, matching bluez_monitor.py
// (see its connect_device/disconnect_device docstrings):
//  - Connect shows "Connecting…" right away, then waits for the ongoing
//    poll (see refreshConnectStatus/pendingConnectAction) to confirm real
//    success/failure -- there's something concrete to wait for.
//  - Disconnect is best-effort: a device that's already out of range may
//    never confirm it, so this doesn't wait for confirmation at all -- it
//    goes straight back to "Connect", same as bluez_monitor.py firing the
//    bluetoothctl disconnect and immediately moving on regardless.
function toggleConnection() {
  const address = currentDeviceAddress;
  const btn = document.getElementById('connect-btn');
  if (!address || !btn) return;
  const disconnecting = btn.dataset.state === 'connected';
  pendingConnectAction = disconnecting ? 'disconnect' : 'connect';
  renderConnectButton(disconnecting ? 'disconnected' : 'connecting');
  // Toasted here, not left for refreshConnectStatus to notice: disconnect is
  // optimistic (see renderConnectButton call above) and jumps straight to
  // 'disconnected' before any poll confirms it, so by the time the next poll
  // runs, lastConnectState is already 'disconnected' and there's no
  // connected->disconnected transition left for it to detect. This only
  // covers a user-initiated disconnect -- a device that drops on its own
  // (out of range, etc) without this button ever being clicked still gets
  // toasted by refreshConnectStatus's own transition check.
  if (disconnecting) showToast(`Device disconnected: ${address}`, { variant: 'disconnected' });
  fetch(`/api/device/${encodeURIComponent(address)}/${disconnecting ? 'disconnect' : 'connect'}`, {
    method: 'POST',
  }).catch(() => {
    // Best-effort -- the ongoing connect-status poll reconciles either way.
  });
}

// Settings is a real page (/settings), not a modal -- this dropdown just
// toggles open/closed; the "Settings" item inside is a plain <a>.
function toggleSettingsMenu(show) {
  const menu = document.getElementById('settings-menu');
  const open = show === undefined ? !menu.classList.contains('open') : show;
  menu.classList.toggle('open', open);
  document.getElementById('hamburger-btn').setAttribute('aria-expanded', String(open));
}

document.getElementById('chart-wrap').addEventListener('click', (e) => {
  const label = e.target.closest('.row-label');
  if (label) { openModal(label.dataset.address); return; }
  const header = e.target.closest('.col-header[data-sort-key]');
  if (header) setSort(header.dataset.sortKey);
});

// Live column-width drag-resize (see pushColumnResizeHandles). Tracked as
// plain module state rather than per-element listeners since the handle
// rects are destroyed and recreated on every render() -- a single
// mousedown/mousemove/mouseup triple attached once on chart-wrap/window
// survives that churn, unlike listeners bound to the (short-lived) rects
// themselves.
let columnResize = null; // { key, startX, startWidth }
let columnResizeRafPending = false;

document.getElementById('chart-wrap').addEventListener('mousedown', (e) => {
  const handle = e.target.closest('.col-resize-handle');
  if (!handle) return;
  e.preventDefault();
  const entry = columnConfig.find(c => c.key === handle.dataset.resizeKey);
  const def = COLUMN_DEFS[handle.dataset.resizeKey];
  if (!entry || !def) return;
  columnResize = { key: handle.dataset.resizeKey, startX: e.clientX, startWidth: entry.width || def.width };
  document.body.classList.add('column-resizing');
});

window.addEventListener('mousemove', (e) => {
  if (!columnResize) return;
  const entry = columnConfig.find(c => c.key === columnResize.key);
  if (!entry) return;
  const delta = e.clientX - columnResize.startX;
  const width = Math.round(columnResize.startWidth + delta);
  entry.width = Math.max(MIN_COLUMN_WIDTH, Math.min(MAX_COLUMN_WIDTH, width));
  // Re-rendering on every mousemove (rather than once per animation frame)
  // can outpace the browser on a large device list -- coalesce to at most
  // one render per frame, same reasoning as any other high-frequency input.
  if (!columnResizeRafPending) {
    columnResizeRafPending = true;
    requestAnimationFrame(() => {
      columnResizeRafPending = false;
      if (allDots || allPoints) applyFilter();
    });
  }
});

window.addEventListener('mouseup', () => {
  if (!columnResize) return;
  columnResize = null;
  document.body.classList.remove('column-resizing');
  saveColumnWidths();
});

// Persists the whole columnConfig (order + visibility unchanged, only the
// dragged column's width differs) via the same endpoint the Settings page's
// column list writes to -- best-effort: the width is already applied
// locally regardless of whether this save succeeds, so a failure here just
// means the drag doesn't survive a reload.
async function saveColumnWidths() {
  try {
    await fetch('/api/columns', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ columns: columnConfig }),
    });
  } catch (err) {
    // Best-effort, see above.
  }
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') { closeModal(); return; }
  const removeBtn = e.target.closest('.tag-pill button');
  if (removeBtn) { removeTag(removeBtn.dataset.tag); return; }
  if (e.target.id === 'connect-btn') toggleConnection();
});
document.getElementById('modal-backdrop').addEventListener('keydown', (e) => {
  if (e.target.id === 'tag-input' && e.key === 'Enter') {
    e.preventDefault();
    const value = e.target.value.trim();
    if (!value) return;
    addTag(value).then(() => { e.target.value = ''; });
  }
});
document.getElementById('hamburger-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleSettingsMenu();
});
document.addEventListener('click', (e) => {
  if (!document.getElementById('menu-wrap').contains(e.target)) toggleSettingsMenu(false);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeModal(); toggleSettingsMenu(false); }
});

window.addEventListener('resize', () => {
  if (viewMode === 'points' ? allPoints : allDots) applyFilter();
});
document.getElementById('refresh').addEventListener('click', loadData);

// Untoggled by default -- autoRefreshTimer stays null until the user clicks
// the button, no init call needed to leave it off. play/pause icon swap and
// the .active style are the only state this needs; loadData() itself
// already re-renders in place, no page reload.
const AUTO_REFRESH_INTERVAL_MS = 2000;
const AUTO_REFRESH_PLAY_ICON = '<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';
const AUTO_REFRESH_PAUSE_ICON = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
let autoRefreshTimer = null;

function setAutoRefreshActive(active) {
  const btn = document.getElementById('auto-refresh-toggle');
  btn.classList.toggle('active', active);
  btn.setAttribute('aria-pressed', String(active));
  btn.innerHTML = active ? AUTO_REFRESH_PAUSE_ICON : AUTO_REFRESH_PLAY_ICON;
  btn.title = active ? 'Stop auto-refresh' : 'Auto-refresh every 2 seconds';
  if (active) {
    autoRefreshTimer = setInterval(loadData, AUTO_REFRESH_INTERVAL_MS);
  } else if (autoRefreshTimer) {
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = null;
  }
}
document.getElementById('auto-refresh-toggle').addEventListener('click', () => {
  setAutoRefreshActive(autoRefreshTimer === null);
});

document.getElementById('view-mode').addEventListener('change', (e) => {
  viewMode = e.target.value;
  loadData();
});
document.getElementById('time-mode').addEventListener('change', (e) => setTimeMode(e.target.value));
document.getElementById('filter-box').addEventListener('input', () => applyFilter());
document.getElementById('filter-mode').addEventListener('change', () => applyFilter());
document.getElementById('top-enabled').addEventListener('change', () => applyFilter());
document.getElementById('top-n').addEventListener('input', () => applyFilter());
document.getElementById('graph-height').addEventListener('input', (e) => {
  const value = e.target.value.trim();
  customGraphHeight = value === '' ? null : Number(value);
  if (viewMode === 'points' ? allPoints : allDots) applyFilter();
});

setTimeMode('relative');
loadColumnConfig().then(loadData);
pollGlobalConnectStatuses();
setInterval(pollGlobalConnectStatuses, GLOBAL_CONNECT_POLL_MS);
</script>
</body>
</html>
